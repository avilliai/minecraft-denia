# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom + IntelliJ aren't fully compatible with the configuration cache yet.
org.gradle.configuration-cache=false

# Fabric — coordinates verified for Minecraft 1.21.11 (June 2026)
# See https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_api_version=0.141.4+1.21.11
loom_version=1.16.3

# Toolchain — use the bundled JDK 21 (github-hosted auto-download is unreachable here).
# Loom 1.16 also requires the Gradle daemon itself to run on JDK 21.
org.gradle.java.home=C:/Users/Administrator/WebstormProjects/untitled1/mc-girlfriend/.jdks/jdk-21.0.11+10
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:/Users/Administrator/WebstormProjects/untitled1/mc-girlfriend/.jdks/jdk-21.0.11+10

# Mod
mod_version=0.1.0
maven_group=xyz.apollodorus.mcgf
# 插件对外品牌名 = denia（产物 jar = denia-<version>.jar）。内部 modid/包名仍是 mcgf（不重命名，避免破坏）。
archives_base_name=denia
